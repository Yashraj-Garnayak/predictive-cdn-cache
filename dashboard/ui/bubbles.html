<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Trending Now bubbles. Loaded once; new data is read from the parent page (see poll()) so the
     frame never reloads and bubbles glide between hours instead of flickering. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/*THEME*/
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--font); }
#stage { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; }

/* soft colour blobs behind the glass, so the blur has something to refract */
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .45; animation: drift 24s ease-in-out infinite alternate; }
.blob.a { width: 46%; height: 60%; left: 4%; top: 10%; background: rgba(10,132,255,.35); }
.blob.b { width: 40%; height: 55%; right: 6%; top: 30%; background: rgba(191,90,242,.30); animation-delay: -8s; }
.blob.c { width: 30%; height: 40%; left: 40%; bottom: -6%; background: rgba(48,209,88,.18); animation-delay: -16s; }
@keyframes drift { to { transform: translate(6%, -8%) scale(1.12); } }

.bubble { position: absolute; left: 0; top: 0; will-change: transform; }
.sphere {
  position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; cursor: pointer;
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(14px) saturate(170%); -webkit-backdrop-filter: blur(14px) saturate(170%);
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3),
              inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08);
  transition: transform .45s var(--ease), border-color .6s;
}
.bubble:hover .sphere { transform: scale(1.09); border-color: rgba(255,255,255,.4); }
.bubble.leaving { pointer-events: none; opacity: 0 !important; transition: opacity .6s var(--ease); }
.bubble.leaving .sphere { transform: scale(.3); transition: transform .6s var(--ease); }

/* green and pink tints cross-fade, so a colour change between hours is smooth */
.tint { position: absolute; inset: 0; border-radius: 50%; transition: opacity .8s var(--ease); }
.tint.g { background: radial-gradient(circle at 50% 115%, rgba(48,209,88,.75), rgba(48,209,88,.26) 55%, rgba(48,209,88,.10) 80%);
          box-shadow: inset 0 -12px 28px rgba(48,209,88,.45), inset 0 0 18px rgba(48,209,88,.25); }
.tint.p { background: radial-gradient(circle at 50% 115%, rgba(255,55,95,.75), rgba(255,55,95,.26) 55%, rgba(255,55,95,.10) 80%);
          box-shadow: inset 0 -12px 28px rgba(255,55,95,.45), inset 0 0 18px rgba(255,55,95,.25); }
.bubble.hit .tint.p, .bubble.miss .tint.g { opacity: 0; }

/* glossy highlight on the top edge */
.shine { position: absolute; left: 14%; right: 14%; top: 4%; height: 38%; border-radius: 50%;
         background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 70%, transparent);
         opacity: .75; pointer-events: none; }
.glow { position: absolute; inset: -30%; border-radius: 50%; z-index: -1; filter: blur(18px); opacity: .5; transition: background .8s; }
.bubble.hit .glow { background: radial-gradient(circle, rgba(48,209,88,.45), transparent 60%); }
.bubble.miss .glow { background: radial-gradient(circle, rgba(255,55,95,.45), transparent 60%); }

.label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; padding: 0 14%; color: #fff; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.label .t { font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.label .n { margin-top: 3px; opacity: .75; font-weight: 500; font-variant-numeric: tabular-nums; }

#tip { position: absolute; pointer-events: none; opacity: 0; transform: translateY(4px); z-index: 50;
       min-width: 170px; max-width: 260px; padding: 10px 12px; border-radius: 12px; color: var(--text); font-size: 12.5px;
       background: rgba(44,44,46,.86); border: 1px solid rgba(255,255,255,.12);
       backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
       box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .18s var(--ease), transform .18s var(--ease); }
#tip.on { opacity: 1; transform: translateY(0); }
#tip .tt { font-weight: 650; font-size: 13.5px; margin-bottom: 6px; line-height: 1.25; }
#tip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); line-height: 1.6; }
#tip .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .chip { display: inline-block; margin-top: 7px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 11.5px; }
#tip .chip.hit { color: var(--green); background: rgba(48,209,88,.15); }
#tip .chip.miss { color: var(--pink); background: rgba(255,55,95,.15); }

#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: var(--muted); font-size: 15px; transition: opacity .5s; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div id="empty">Waiting for the first hour…</div>
  <div id="tip"></div>
</div>
<script>
const stage = document.getElementById("stage"), tip = document.getElementById("tip");
const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = stage.clientWidth, H = stage.clientHeight, nodes = [], mouse = null, lastRaw = "";
const fmt = d3.format(","), fmt1 = d3.format(",.1f");

// ---------- physics ----------
function walls() {                       // bounce off the edges
  for (const n of nodes) {
    if (n.x - n.r < 0 && n.vx < 0 || n.x + n.r > W && n.vx > 0) n.vx *= -0.8;
    if (n.y - n.r < 0 && n.vy < 0 || n.y + n.r > H && n.vy > 0) n.vy *= -0.8;
  }
}
function wander() {                      // gentle floating
  if (calm) return;
  const t = performance.now() / 1000;
  for (const n of nodes) {
    n.vx += Math.cos(t * 0.5 + n.phase) * 0.018;
    n.vy += Math.sin(t * 0.4 + n.phase * 1.7) * 0.018;
  }
}
function repel() {                       // push away from the mouse cursor
  if (!mouse) return;
  for (const n of nodes) {
    const dx = n.x - mouse.x, dy = n.y - mouse.y, d = Math.hypot(dx, dy) || 1, reach = n.r + 80;
    if (d < reach) { const f = (1 - d / reach) * 1.6; n.vx += dx / d * f; n.vy += dy / d * f; }
  }
}
const collide = d3.forceCollide(d => d.r + 4).strength(0.8).iterations(2);
const sim = d3.forceSimulation([])
  .alpha(1).alphaDecay(0).velocityDecay(0.14)        // never cools down, so it keeps floating
  .force("x", d3.forceX(() => W / 2).strength(0.004))
  .force("y", d3.forceY(() => H / 2).strength(0.008))
  .force("collide", collide).force("wander", wander).force("repel", repel).force("walls", walls)
  .on("tick", tick);

let lastT = performance.now();
function tick() {
  const now = performance.now(), ease = 1 - Math.exp(-(now - lastT) / 180);  // time-based, so speed is
  lastT = now;                                                                 // the same at any frame rate
  let resized = false;
  for (const n of nodes) {
    const dr = n.target - n.r;           // ease radius toward its new size
    if (Math.abs(dr) > 0.1) { n.r += dr * ease; resized = true; }
    const v = Math.hypot(n.vx, n.vy), max = mouse ? 6 : 1.6;
    if (v > max) { n.vx *= max / v; n.vy *= max / v; }
    n.x = Math.max(n.r, Math.min(W - n.r, n.x));
    n.y = Math.max(n.r, Math.min(H - n.r, n.y));
  }
  if (resized) collide.radius(d => d.r + 4);
  for (const n of nodes) {
    const s = n.el.style, d = 2 * n.r;
    s.width = s.height = d + "px";
    s.transform = `translate(${n.x - n.r}px, ${n.y - n.r}px)`;
    s.opacity = Math.min(1, n.r / (0.6 * n.target || 1));
    if (Math.abs(n.fontFor - d) > 3) layoutLabel(n, d);
  }
}

// ---------- drawing ----------
function layoutLabel(n, d) {
  n.fontFor = d;
  const fs = Math.max(9, Math.min(17, d / 7.5)), chars = Math.max(6, Math.round(d / fs * 1.6));
  const t = n.datum.title.length > chars ? n.datum.title.slice(0, chars - 1).trimEnd() + "…" : n.datum.title;
  n.labelT.textContent = d < 34 ? "" : t;
  n.labelT.style.fontSize = fs + "px";
  n.labelN.style.fontSize = Math.max(8, fs * 0.78) + "px";
  n.labelN.style.display = d < 70 ? "none" : "";
}
function makeNode(datum) {
  const el = document.createElement("div");
  el.className = "bubble";
  el.innerHTML = '<div class="glow"></div><div class="sphere"><div class="tint g"></div><div class="tint p"></div>'
               + '<div class="shine"></div><div class="label"><div class="t"></div><div class="n"></div></div></div>';
  stage.appendChild(el);
  const side = Math.random() * 2 * Math.PI;           // float in from just inside a random edge
  const n = { id: datum.id, el, r: 0, target: 0, phase: Math.random() * 6.28, fontFor: -99,
              x: W / 2 + Math.cos(side) * W * 0.35, y: H / 2 + Math.sin(side) * H * 0.35, vx: 0, vy: 0,
              labelT: el.querySelector(".t"), labelN: el.querySelector(".n") };
  el.addEventListener("mouseenter", () => showTip(n));
  el.addEventListener("mouseleave", () => tip.classList.remove("on"));
  return n;
}
function radii(data) {                   // area ~ requests; bubbles fill about a third of the stage
  const total = d3.sum(data, d => d.actual) || 1, k = Math.sqrt(0.38 * W * H / (Math.PI * total));
  const max = Math.min(W, H) * 0.24;
  return d => Math.max(22, Math.min(max, k * Math.sqrt(d.actual)));
}
function update(data) {
  document.getElementById("empty").style.opacity = data.length ? 0 : 1;
  const r = radii(data), byId = new Map(nodes.map(n => [n.id, n])), seen = new Set();
  for (const d of data) {
    const n = byId.get(d.id) || makeNode(d);
    if (!byId.has(d.id)) nodes.push(n);
    n.datum = d; n.target = r(d); n.fontFor = -99; seen.add(d.id);
    n.el.classList.toggle("hit", d.hit); n.el.classList.toggle("miss", !d.hit);
    n.labelN.textContent = fmt(d.actual);
  }
  for (const n of nodes) if (!seen.has(n.id)) {   // dropped out of the top list: fade away, then remove
    n.el.classList.add("leaving"); setTimeout(() => n.el.remove(), 700);
    if (tipNode === n) tip.classList.remove("on");
  }
  nodes = nodes.filter(n => seen.has(n.id));
  sim.nodes(nodes);
  if (tipNode && tip.classList.contains("on")) showTip(tipNode);
}

// ---------- tooltip ----------
let tipNode = null;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function showTip(n) {
  tipNode = n; const d = n.datum;
  tip.innerHTML = `<div class="tt">${esc(d.title)}</div>`
    + `<div class="row">Actual requests <b>${fmt(d.actual)}</b></div>`
    + `<div class="row">Predicted requests <b>${fmt1(d.predicted)}</b></div>`
    + `<span class="chip ${d.hit ? "hit" : "miss"}">${d.hit ? "Model predicted it" : "Model missed it"}</span>`;
  tip.classList.add("on");
}
stage.addEventListener("mousemove", e => {
  const b = stage.getBoundingClientRect();
  mouse = { x: e.clientX - b.left, y: e.clientY - b.top };
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(W - tw - 8, mouse.x + 14) + "px";
  tip.style.top = (mouse.y + th + 20 > H ? mouse.y - th - 14 : mouse.y + 16) + "px";
});
stage.addEventListener("mouseleave", () => { mouse = null; tip.classList.remove("on"); });

// ---------- data from the Streamlit page ----------
function decode(b64) { return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)))); }
function poll() {
  let el = null;
  try { el = window.parent.document.querySelector(".pcache-bubble-data"); } catch (e) { /* parent not reachable */ }
  const raw = el ? el.textContent.trim() : "";
  if (raw && raw !== lastRaw) { lastRaw = raw; try { update(decode(raw)); } catch (e) { console.error(e); } }
}
setInterval(poll, 250);
poll();

new ResizeObserver(() => {
  W = stage.clientWidth; H = stage.clientHeight;
  if (nodes.length) { const r = radii(nodes.map(n => n.datum)); nodes.forEach(n => { n.target = r(n.datum); }); }
}).observe(stage);
</script>
</body>
</html>
